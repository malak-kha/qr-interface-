<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartAid 360</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 15%, #263b5c 0%, transparent 35%),
                radial-gradient(circle at 10% 90%, #18283e 0%, transparent 30%),
                #05080d;

            color: #ffffff;
            font-family: "Helvetica Neue", Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow-x: hidden;
        }

        .page {
            width: 100%;
            max-width: 650px;
            min-height: 100vh;

            padding: 70px 28px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            position: relative;
        }

        /* Decorative glow */

        .glow {
            position: absolute;
            width: 280px;
            height: 280px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.04);

            filter: blur(70px);

            pointer-events: none;
        }

        .glow.one {
            top: 5%;
            left: -120px;
        }

        .glow.two {
            bottom: 5%;
            right: -120px;
        }

        /* Top label */

        .eyebrow {
            font-size: 11px;
            letter-spacing: 5px;
            text-transform: uppercase;

            color: #8fa0b5;

            margin-bottom: 30px;

            animation: fadeUp 1s ease forwards;
        }

        /* Main title */

        .decoded {
            font-family: Georgia, "Times New Roman", serif;

            font-size: clamp(48px, 13vw, 82px);

            font-weight: 400;

            letter-spacing: -2px;

            line-height: 0.95;

            margin-bottom: 8px;

            background: linear-gradient(
                120deg,
                #ffffff,
                #b9c7d8
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: fadeUp 1s ease 0.15s both;
        }

        /* HOPE */

        .hope {
            font-family: Georgia, "Times New Roman", serif;

            font-size: clamp(58px, 16vw, 100px);

            font-weight: 700;

            letter-spacing: 8px;

            line-height: 1;

            margin-bottom: 38px;

            position: relative;

            animation: fadeUp 1s ease 0.3s both;
        }

        .hope::after {
            content: "";

            display: block;

            width: 55px;
            height: 1px;

            background: rgba(255,255,255,0.6);

            margin: 22px auto 0;
        }

        /* Description */

        .message {
            max-width: 570px;

            font-size: clamp(17px, 4vw, 21px);

            line-height: 1.8;

            font-weight: 300;

            color: #d5dce5;

            margin-bottom: 25px;

            animation: fadeUp 1s ease 0.45s both;
        }

        /* Highlight */

        .highlight {
            font-family: Georgia, "Times New Roman", serif;

            font-size: clamp(18px, 4.5vw, 23px);

            font-style: italic;

            line-height: 1.7;

            color: #ffffff;

            max-width: 530px;

            animation: fadeUp 1s ease 0.6s both;
        }

        .heart {
            display: inline-block;

            font-style: normal;

            margin-left: 5px;

            animation: heartbeat 2s infinite;
        }

        /* Bottom brand */

        .brand {
            margin-top: 55px;

            font-size: 10px;

            letter-spacing: 4px;

            color: #647386;

            text-transform: uppercase;

            animation: fadeUp 1s ease 0.75s both;
        }

        /* Animations */

        @keyframes fadeUp {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @keyframes heartbeat {

            0%, 100% {
                transform: scale(1);
            }

            15% {
                transform: scale(1.18);
            }

            30% {
                transform: scale(1);
            }

        }

        /* Mobile */

        @media (max-width: 480px) {

            .page {
                padding: 55px 24px;
            }

            .eyebrow {
                letter-spacing: 3px;
            }

            .hope {
                letter-spacing: 5px;
            }

            .message {
                line-height: 1.7;
            }

        }
    </style>
</head>

<body>

    <div class="glow one"></div>
    <div class="glow two"></div>

    <main class="page">

        <div class="eyebrow">
            SMARTAID 360
        </div>

        <h1 class="decoded">
            You decoded it.
        </h1>

        <div class="hope">
            HOPE.
        </div>

        <p class="message">
            SmartAid 360 turns technology into action —
            detecting accidents, sending alerts,
            and helping save lives.
        </p>

        <p class="highlight">
            Because behind every line of code,
            there is a life worth protecting.
            <span class="heart">💗</span>
        </p>

        <div class="brand">
            Technology · Safety · Humanity
        </div>

    </main>

</body>
</html>
